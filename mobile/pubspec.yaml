name: yaro0_mobile
description: A Flutter mobile app for the Yaaro0 project.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  flutter_secure_storage: ^10.2.0
  socket_io_client: ^3.1.4
  intl: ^0.20.2
  http_parser: ^4.0.2
  app_links: ^6.1.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  file_picker: ^8.0.0
  record: ^6.2.1
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  flutter_cache_manager: ^3.4.1
  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1
  # Maps (free OpenStreetMap tiles — no API key needed)
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  # Calls (ZEGOCLOUD prebuilt UI)
  zego_uikit_prebuilt_call: 4.14.14
  # Swipe cards
  appinio_swiper: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/logo.png
    - assets/brand/logo-mark.png
    - assets/landing/
