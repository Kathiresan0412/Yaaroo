name: yaro0_mobile
description: A Flutter mobile app for the Yaaro0 project.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  app_links: ^6.1.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  file_picker: ^8.0.0
  record: ^6.2.1
  path_provider: ^2.1.5
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  flutter_cache_manager: ^3.4.1

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1

  # Local persistence
  shared_preferences: ^2.3.4

  # Image Processing
  flutter_image_compress: ^2.3.0
  uuid: ^4.5.1
  path: ^1.9.0

  # Google Maps
  google_maps_flutter: ^2.10.0

  # Push Notifications (local display)
  flutter_local_notifications: ^18.0.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Swipe Card Deck
  appinio_swiper: ^2.1.1

  # Video/Audio Calling (disabled until ZegoCloud fixes version compatibility)
  # zego_uikit_prebuilt_call: 4.16.12
  # zego_uikit_signaling_plugin: 2.8.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/logo.png
    - assets/brand/logo-mark.png
    - assets/landing/
